<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Etch-A-Sketch</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="sketch-container">
        <div class="heading">
            <div class="heading-title">Etch-A-Sketch</div>
        </div>
        <div class="squares-container"></div>
        <div class="buttons-container">
            <button class="color-mode">
                <img src="./images/knob.png">
                <div class="button-text">Color Mode</div>
            </button>
            <button class="clear-colors">Clear Colors</button>
            <button class="change-number-squares">
                <img src="./images/knob.png">
                <div class="button-text">Pointer Size</div>
            </button>
        </div>    
        <dialog id="modal-pointer-size" class="modal-box">
            <div class="modal-content">
                <div class="modal-heading">
                    <div class="modal-title">Change pointer size</div>
                    <div class="modal-description">The higher the number, the smaller each pointer size</div>
                </div> 
                <div class="input-section">
                    <label for="input-squares">Enter a number between 16 and 100:</label>
                    <input id="input-squares" type="text">
                </div>
                <div class="modal-buttons-container">
                    <button class="modal-button" id="continue-button-grid">Continue</button>
                    <button class="modal-button" id="cancel-button-grid">Cancel</button>
                </div>             
            </div>
        </dialog>
        <dialog id="modal-color-mode" class="modal-box">
            <div class="modal-content">
                <div class="modal-heading">
                    <div class="modal-title">Choose your Color</div>
                </div>
                <ul class="radio-input-section">
                    <li>
                        <input type="radio" id="black" name="color-option">
                        <label for="black">Black</label>
                    </li>
                    <li>
                        <input type="radio" id="hex" name="color-option" checked>
                        <label for="hex">Hex colors</label>
                    </li>
                    <li>
                        <input type="radio" id="rgb" name="color-option">
                        <label for="rgb">RGB colors</label>
                    </li>
                    <li>
                        <input type="radio" id="gray" name="color-option">
                        <label for="gray">Gray color</label>
                    </li>
                </ul>
                <div class="modal-buttons-container">
                    <button class="modal-button" id="continue-button-color">Continue</button>
                    <button class="modal-button" id="cancel-button-color">Cancel</button>
                </div>
            </div>
        </dialog>    
        
    </div>
    <div class="footer">TOP project by Cherry © 2026</div>

    <script type="module" src="./script.js"></script>
</body>
</html>
