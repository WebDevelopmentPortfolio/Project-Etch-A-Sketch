<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Etch-A-Sketch</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="sketch-container">
        <div class="heading">
            <div class="heading-title">Etch-A-Sketch</div>
        </div>
        <div class="squares-container"></div>
        <div class="buttons-container">
            <button class="clear-colors">Clear Colors</button>
            <button class="change-number-squares">Pointer Size</button>
        </div>    
        <dialog id="custom-modal" class="modal-box">
            <div class="modal-content">
                <div class="modal-heading">
                    <div class="modal-title">Change pointer size</div>
                    <div class="modal-description">The higher the number, the smaller each pointer size</div>
                </div> 
                <div class="input-section">
                    <label for="input-squares">Enter a number between 16 and 100:</label>
                    <input id="input-squares" type="text">
                </div>
                <div class="modal-buttons">
                    <button id="continue-button">Continue</button>
                    <button id="cancel-button">Cancel</button>
                </div>             
            </div>
        </dialog>    
        
    </div>
    
    <div class="footer">TOP project by Cherry © 2026</div>

    <script type="module" src="./script.js"></script>
</body>
</html>
